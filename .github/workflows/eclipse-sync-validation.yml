name: Eclipse Sync and subtitle validation

on:
  workflow_dispatch:
  push:
    branches: [stremio-playback-fix-v6-animesub-subtitles]
    paths:
      - "Eclipse/Player/EclipseSync*.swift"
      - "Tests/EclipseSync*.swift"
      - ".github/workflows/eclipse-sync-validation.yml"

permissions:
  contents: read

concurrency:
  group: eclipse-sync-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Soupy-dev/MPVKit
          ref: 7485d3ef01f21963443824002566a7d0d3c50fae
          path: MPVKit
      - run: ln -sfn "$GITHUB_WORKSPACE/MPVKit" "$GITHUB_WORKSPACE/../MPVKit"
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Configure simulator build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          test -n "${TMDB_API_KEY:-}"
          cat > Build.local.xcconfig <<EOF
          APP_NAME = Eclipse Patched
          BUNDLE_IDENTIFIER = app.Eclipse.Soupy.Patched
          DEVELOPMENT_TEAM = ANMK3Y568U
          CODE_SIGN_ENTITLEMENTS =
          ICLOUD_CONTAINER_ID =
          TMDB_API_KEY = ${TMDB_API_KEY}
          EOF
      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Eclipse.xcodeproj -scheme Eclipse \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -skipPackagePluginValidation -skipMacroValidation
      - name: Build and test iOS subtitle and sync regressions
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')"
          xcodebuild test -jobs 1 \
            -project Eclipse.xcodeproj -scheme Eclipse -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 120 -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/EclipseSyncValidation.xcresult" \
            -only-testing:Tests/SubtitleDocumentTests \
            -only-testing:Tests/SubtitleProviderTests \
            -only-testing:Tests/SubtitleMetadataResolverTests \
            -only-testing:Tests/StremioAnimeSubtitleLookupTests \
            -only-testing:Tests/WatchTogetherProtocolTests \
            -only-testing:Tests/PlaybackLifecycleRecoveryPolicyTests \
            -only-testing:Tests/EclipseSyncProtocolTests \
            -only-testing:Tests/EclipseSyncCoordinatorTests \
            -only-testing:Tests/EclipseSyncTransportTests \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@2848b2cda0e5190984587e4552b4bb6e6a4b2b674 # v4
        with:
          name: eclipse-sync-validation-results
          path: ${{ runner.temp }}/EclipseSyncValidation.xcresult
          if-no-files-found: ignore
          retention-days: 7
