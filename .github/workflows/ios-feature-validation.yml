name: iOS feature source validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/ios-playback-background-turkish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check translations and property list
        run: python3 scripts/verify_ios_feature_resources.py
  swift-syntax:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Select current stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable
      - name: Parse changed Swift sources with the iOS SDK
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          python3 - "$sdk" <<'PY'
          import subprocess
          import sys
          files = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', 'origin/main...HEAD']
          ).decode().split('\0')
          for path in files:
              if path.endswith('.swift'):
                  subprocess.run([
                      'xcrun', 'swiftc', '-frontend', '-parse',
                      '-target', 'arm64-apple-ios15.0-simulator', '-sdk', sys.argv[1],
                      '-D', 'ECLIPSE_MPVKIT_MOLTENVK_INLINE_RENDERER',
                      '-D', 'ECLIPSE_MPVKIT_SAMPLE_BUFFER_PIP_BRIDGE', path
                  ], check=True)
          PY
          plutil -lint Eclipse.xcodeproj/project.pbxproj
      - name: Type-check display preference and background transport
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun swiftc -typecheck -swift-version 5 \
            -target arm64-apple-ios15.0-simulator -sdk "$sdk" \
            Eclipse/Extensions/DisplayRefreshSettings.swift
          # This standalone check substitutes only the existing downloader's
          # constant, keeping the real Foundation/URLSession delegate APIs.
          printf '%s\n' 'enum HLSDownloader { static let maximumMediaObjectBytes = 128 * 1024 * 1024 }' > "$RUNNER_TEMP/hls-limit-stub.swift"
          xcrun swiftc -typecheck -swift-version 5 \
            -target arm64-apple-ios15.0-simulator -sdk "$sdk" \
            Eclipse/Models/HLSBackgroundTransport.swift "$RUNNER_TEMP/hls-limit-stub.swift"
          xcrun swiftc -typecheck -swift-version 5 \
            -target arm64-apple-ios15.0-simulator -sdk "$sdk" \
            Eclipse/Models/DownloadBackgroundExecution.swift
