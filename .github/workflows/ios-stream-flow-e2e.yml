name: iPhone stream flow E2E

# Drives search → movie detail → source sheet → stream picker → player in a
# Release-optimized simulator build against a local Torrentio + TorBox shaped
# addon. Runs on the newest iOS runtime and on an iOS 18 runtime when the
# runner provides one, and keeps any crash report and call stack as artifacts.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/custom-eclipse-lifecycle
      - diag/stream-flow-e2e
    paths:
      - "Eclipse/**"
      - "EclipseUITests/**"
      - "Eclipse.xcodeproj/**"
      - "scripts/e2e/**"
      - ".github/workflows/ios-stream-flow-e2e.yml"

permissions:
  contents: read

concurrency:
  group: ios-stream-flow-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-flow:
    runs-on: macos-15
    timeout-minutes: 170

    steps:
      - name: Checkout patched Eclipse
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout matching MPVKit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Soupy-dev/MPVKit
          ref: 7485d3ef01f21963443824002566a7d0d3c50fae
          path: MPVKit

      - name: Expose sibling MPVKit package
        run: ln -sfn "$GITHUB_WORKSPACE/MPVKit" "$GITHUB_WORKSPACE/../MPVKit"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Record toolchain and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Create unsigned local build config
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::TMDB_API_KEY GitHub Actions secret is missing."
            exit 1
          fi
          cat > Build.local.xcconfig <<'EOF'
          APP_NAME = Eclipse Patched
          BUNDLE_IDENTIFIER = app.Eclipse.Soupy.Patched
          DEVELOPMENT_TEAM = ANMK3Y568U
          ECLIPSE_RELEASE_VERSION = 6.0.1
          ECLIPSE_SYNC_SERVER_URL = wss:/$()/eclipse-sync.onrender.com
          CODE_SIGN_ENTITLEMENTS =
          ICLOUD_CONTAINER_ID =
          ANILIST_CLIENT_ID =
          ANILIST_CLIENT_SECRET =
          ANILIST_REDIRECT_URI = luna:/$()/anilist-callback
          TRAKT_CLIENT_ID =
          TRAKT_CLIENT_SECRET =
          TRAKT_REDIRECT_URI = luna:/$()/trakt-callback
          MAL_CLIENT_ID =
          MAL_CLIENT_SECRET =
          MAL_REDIRECT_URI = luna:/$()/mal-callback
          EOF
          printf 'TMDB_API_KEY = %s\n' "$TMDB_API_KEY" >> Build.local.xcconfig

      - name: Generate mkv, mp4 and avi fixtures
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          MEDIA="$RUNNER_TEMP/e2e-media"
          mkdir -p "$MEDIA"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 90 \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 128k \
            -movflags +faststart "$MEDIA/h264-aac.mp4"
          ffmpeg -hide_banner -loglevel error -i "$MEDIA/h264-aac.mp4" -c copy "$MEDIA/h264-aac.mkv"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 \
            -f lavfi -i sine=frequency=330:sample_rate=48000 -t 90 \
            -c:v libx265 -preset ultrafast -pix_fmt yuv420p10le -x265-params log-level=error \
            -c:a aac -b:a 128k "$MEDIA/hevc-aac.mkv"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 \
            -f lavfi -i sine=frequency=550:sample_rate=48000 -t 90 \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a libmp3lame -b:a 128k "$MEDIA/h264-aac.avi"
          ls -l "$MEDIA"
          echo "E2E_MEDIA=$MEDIA" >> "$GITHUB_ENV"

      - name: Start local Torrentio + TorBox shaped addon
        run: |
          set -euo pipefail
          nohup python3 -I scripts/e2e/fake_torrentio_addon.py --port 8765 \
            --media "$E2E_MEDIA" --log "$RUNNER_TEMP/e2e-addon.log" > "$RUNNER_TEMP/e2e-addon.out" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/manifest.json >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/manifest.json
          curl -fsS http://127.0.0.1:8765/stream/movie/tt1375666.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["streams"]), "streams")'
          curl -fsSIL http://127.0.0.1:8765/resolve/torbox/e2e-not-a-real-key/2849211f150e966ef7924f43aec22727a644e10d/null/0/a.mkv | grep -E '^(HTTP|Content-Length|Location)'

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$RUNNER_TEMP/SourcePackages"
          xcodebuild -resolvePackageDependencies \
            -project Eclipse.xcodeproj \
            -scheme EclipseStreamFlowE2E \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation
          echo "SOURCE_PACKAGES_DIR=$SOURCE_PACKAGES_DIR" >> "$GITHUB_ENV"

      - name: Choose iPhone simulators
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_ENV" <<'PY'
          import json, re, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          phones = []
          for runtime, group in devices.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in group:
                  if device["name"].startswith("iPhone"):
                      phones.append((version, "Pro Max" in device["name"], device["udid"], device["name"]))
          phones.sort()
          newest = max(phones)
          print(f"SIM_NEWEST={newest[2]}")
          print(f"SIM_NEWEST_NAME={newest[3]} iOS {newest[0][0]}.{newest[0][1]}")
          legacy = [p for p in phones if p[0][0] == 18]
          if legacy:
              chosen = max(legacy)
              print(f"SIM_IOS18={chosen[2]}")
              print(f"SIM_IOS18_NAME={chosen[3]} iOS {chosen[0][0]}.{chosen[0][1]}")
          PY
          grep '^SIM_' "$GITHUB_ENV" || true

      - name: Build Release app and UI tests for the simulator
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/E2EDerivedData"
          xcodebuild build-for-testing \
            -jobs 1 \
            -project Eclipse.xcodeproj \
            -scheme EclipseStreamFlowE2E \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIM_NEWEST" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) ECLIPSE_UNSIGNED_BUILD ECLIPSE_UI_TEST_HOOKS' \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO
          XCTESTRUN_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          test -n "$XCTESTRUN_PATH"
          echo "XCTESTRUN_PATH=$XCTESTRUN_PATH" >> "$GITHUB_ENV"

      - name: Run stream flow on the newest iOS and on iOS 18
        env:
          TEST_RUNNER_ECLIPSE_E2E_ADDON_URL: http://127.0.0.1:8765/manifest.json
          TEST_RUNNER_ECLIPSE_E2E_LANGUAGE: tr
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/e2e-results"
          failures=0
          run_on() {
            local label="$1" udid="$2"
            echo "::group::$label"
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN_PATH" \
              -destination "platform=iOS Simulator,id=$udid" \
              -destination-timeout 180 \
              -parallel-testing-enabled NO \
              -resultBundlePath "$RUNNER_TEMP/e2e-results/$label.xcresult" \
              || failures=$((failures+1))
            container="$(xcrun simctl get_app_container "$udid" app.Eclipse.Soupy.Patched data 2>/dev/null || true)"
            if [ -n "$container" ]; then
              cp "$container/Documents/player-logs.txt" "$RUNNER_TEMP/e2e-results/$label-app-log.txt" 2>/dev/null || true
              cp "$container/Documents/last-native-crash-report.txt" "$RUNNER_TEMP/e2e-results/$label-plcrash.txt" 2>/dev/null || true
            fi
            echo "::endgroup::"
          }
          run_on "newest-ios" "$SIM_NEWEST"
          if [ -n "${SIM_IOS18:-}" ]; then
            run_on "ios18" "$SIM_IOS18"
          else
            echo "::warning::No iOS 18 simulator runtime on this runner; only the newest runtime was exercised."
          fi
          echo "E2E_FAILURES=$failures" >> "$GITHUB_ENV"

      - name: Collect crash reports and call stacks
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/e2e-results"
          mkdir -p "$OUT/DiagnosticReports"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 \( -name 'Eclipse*' -o -name '*Eclipse*' \) -newer "$GITHUB_WORKSPACE/Build.xcconfig" -exec cp {} "$OUT/DiagnosticReports/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP/e2e-addon.log" "$OUT/" 2>/dev/null || true
          for bundle in "$OUT"/*.xcresult; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool get test-results tests --path "$bundle" > "${bundle%.xcresult}-tests.json" 2>/dev/null || true
            # Screenshots, accessibility trees and XCTest crash logs as plain
            # files; the raw bundle is zstd-packed and hundreds of megabytes.
            if xcrun xcresulttool export attachments --path "$bundle" --output-path "${bundle%.xcresult}-attachments"; then
              find "${bundle%.xcresult}-attachments" \( -name '*.mp4' -o -name '*.mov' \) -size +20M -delete || true
              rm -rf "$bundle"
            fi
          done
          ls -R "$OUT/DiagnosticReports" || true
          for report in "$OUT"/DiagnosticReports/*; do
            [ -f "$report" ] || continue
            echo "::group::$(basename "$report")"
            head -c 20000 "$report"
            echo "::endgroup::"
          done
          if [ -n "${TMDB_API_KEY:-}" ]; then
            # grep exits 1 when nothing matches, which is the expected case.
            { grep -rlF "$TMDB_API_KEY" "$OUT" 2>/dev/null || true; } | while read -r leaked; do
              echo "Removing artifact file that contains the TMDB key: ${leaked#$OUT/}"
              rm -f "$leaked"
            done
          fi

      - name: Upload stream flow results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stream-flow-e2e-${{ github.run_number }}
          path: ${{ runner.temp }}/e2e-results
          retention-days: 14

      - name: Fail when any runtime crashed or failed
        run: test "${E2E_FAILURES:-1}" -eq 0
